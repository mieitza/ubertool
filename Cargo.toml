[package]
name = "ubertool"
version = "0.1.0"
edition = "2021"
authors = ["mihai"]
description = "Developer-focused data-transform CLI; agent-friendly Rust port of it-tools"
license = "GPL-3.0"
repository = "https://github.com/mieitza/ubertool"
rust-version = "1.81"
homepage = "https://github.com/mieitza/ubertool"
documentation = "https://github.com/mieitza/ubertool/blob/main/docs/superpowers/specs/2026-05-15-ubertool-cli-design.md"
readme = "README.md"
keywords = ["cli", "agent", "developer-tools", "json", "encoding"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ubertool"
path = "src/lib.rs"

[[bin]]
name = "ubertool"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# M1 hash family
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sha3 = "0.10"
digest = "0.10"
hmac = "0.12"
# M1 password
bcrypt = "0.15"
zxcvbn = "2"
# M1 JWT
jsonwebtoken = "9"
# M1 IDs / tokens
uuid = { version = "1", features = ["v4", "v7"] }
ulid = "1"
rand = "0.8"
# M1 encoding
percent-encoding = "2"
html-escape = "0.2"
# M1 conversion
serde_yaml = "0.9"
toml = "0.8"
# M2 conversion
quick-xml = { version = "0.31", features = ["serialize"] }
csv = "1"
convert_case = "0.6"
slug = "0.1"
sqlformat = "0.2"
pulldown-cmark = "0.10"
similar = "2"
# M3 network / calc
ipnet = "2"
evalexpr = "11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.8"
cron = "0.12"
# M4 crypto
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
argon2 = "0.5"
pbkdf2 = "0.12"
rsa = "0.9"
pkcs1 = { version = "0.7", features = ["pem"] }
pkcs8 = { version = "0.10", features = ["pem"] }
totp-rs = "5"
# M4 PDF
lopdf = "0.32"
# M4 regex
regex = "1"
regex_generate = "0.2"
# M4 validators
email_address = "0.2"
iban_validate = "4"
phonenumber = "0.3"
woothee = "0.13"
# M4 URL
url = "2"
# M5 images
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
figlet-rs = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[package.metadata.dist]
cargo-dist-version = "0.22.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
allow-dirty = ["ci"]
