[package]
name = "ubertool"
version = "0.1.0-alpha.0"
edition = "2021"
authors = ["mihai"]
description = "Developer-focused data-transform CLI; agent-friendly Rust port of it-tools"
license = "GPL-3.0"
repository = "https://github.com/<GH_OWNER>/ubertool"
rust-version = "1.81"

[[bin]]
name = "ubertool"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
