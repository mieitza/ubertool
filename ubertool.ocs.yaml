        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool ulid {command} [flags]:
    group: true
    summary: ULID generation

  ubertool ulid new [flags]:
    summary: Generate a new ULID (lexically-sortable 128-bit identifier)
    flags:
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool url {command} [flags]:
    group: true
    summary: URL percent-encoding and decoding

  ubertool url decode [input] [flags]:
    summary: Decode a percent-encoded string
    arguments:
      - name: input
