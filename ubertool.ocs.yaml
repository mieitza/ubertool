        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hash sha3-512 [input] [flags]:
    summary: Compute SHA3-512 hash (Keccak)
    arguments:
      - name: input
        summary: Literal input to hash (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hmac {command} [flags]:
    group: true
    summary: Keyed-hash MAC (md5/sha1/sha224/sha256/sha384/sha512/sha3-256/sha3-512)

  ubertool hmac md5 [input] [flags]:
    summary: Compute HMAC-MD5 (legacy / not collision-resistant)
    arguments:
      - name: input
        summary: Literal input to MAC (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: key
        summary: HMAC secret key (required)
        type: string
        required: true
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hmac sha1 [input] [flags]:
    summary: Compute HMAC-SHA1 (legacy)
    arguments:
