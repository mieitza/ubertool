        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool url encode [input] [flags]:
    summary: Percent-encode a string for use in URLs
    arguments:
      - name: input
        summary: Literal input to encode (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
