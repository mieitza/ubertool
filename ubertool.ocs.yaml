  ubertool json {command} [flags]:
    group: true
    summary: "JSON conversion: to-yaml / to-toml / minify / prettify"

  ubertool json minify [input] [flags]:
    summary: Minify JSON (strip whitespace)
    arguments:
      - name: input
        summary: Literal JSON to minify (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool json prettify [input] [flags]:
