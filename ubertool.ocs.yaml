    summary: JSON Web Token decode and verify (HS* only)

  ubertool jwt decode [input] [flags]:
    summary: Decode a JWT without verifying its signature
    arguments:
      - name: input
        summary: JWT to decode (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool jwt verify [input] [flags]:
    summary: Verify a JWT signature (HS256/HS384/HS512 only)
    arguments:
      - name: input
        summary: JWT to verify (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: secret
        summary: Shared HMAC secret (required)
        type: string
        required: true
      - name: algo
        summary: Signing algorithm
        type: string
        default: hs256
        choices:
          - value: hs256
          - value: hs384
          - value: hs512
      - name: validate-exp
        summary: Validate exp claim against the current time
        type: boolean
        default: false
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

