  ubertool token {command} [flags]:
    group: true
    summary: Random token generation (hex / base64 / alphanumeric)

  ubertool token new [flags]:
    summary: Generate a random token from a CSPRNG
    flags:
      - name: length
        summary: Length in bytes of entropy (for hex/base64) or character count (for alphanumeric)
        type: integer
        default: "32"
      - name: format
        summary: Output format
        type: string
        default: hex
        choices:
