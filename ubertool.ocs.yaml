opencliVersion: 1.0.0-alpha.7

info:
  title: ubertool
  summary: Developer-focused data-transform utilities, agent-friendly
  version: 0.1.0-alpha.0
  binary: ubertool

commands:
  ubertool {command} [flags]:
    group: true

  ubertool base64 {command} [flags]:
    group: true
    summary: Base64 encoding and decoding

  ubertool base64 encode [input] [flags]:
    summary: Encode input as base64 (standard alphabet, with padding)
    arguments:
      - name: input
        summary: Literal input to encode (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: out
        summary: Write encoded output to file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool base64 decode [input] [flags]:
    summary: Decode base64 input (standard alphabet, with padding)
    arguments:
      - name: input
        summary: Literal base64 to decode (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read base64 input from file
        type: string
      - name: out
        summary: Write decoded bytes to file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool basic-auth {command} [flags]:
    group: true
    summary: HTTP Basic auth header encoding/decoding

  ubertool basic-auth encode [flags]:
    summary: Encode a user/pass pair as an HTTP Basic Authorization header value
    flags:
      - name: user
        summary: Username
        type: string
        required: true
      - name: pass
        summary: Password
        type: string
        required: true
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool basic-auth decode [input] [flags]:
    summary: Decode an HTTP Basic Authorization header value into user/pass
    arguments:
      - name: input
        summary: Header value to decode (with or without the leading "Basic ")
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool bcrypt {command} [flags]:
    group: true
    summary: Bcrypt password hashing and verification

  ubertool bcrypt hash [input] [flags]:
    summary: Hash a password using bcrypt
    arguments:
      - name: input
        summary: Password to hash (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read password from file
        type: string
      - name: cost
        summary: Bcrypt cost factor (4-31)
        type: integer
        default: "12"
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool bcrypt verify [input] [flags]:
    summary: Verify a password against a bcrypt hash
    arguments:
      - name: input
        summary: Password to check (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read password from file
        type: string
      - name: hash
        summary: Bcrypt hash to verify against (required)
        type: string
        required: true
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hash {command} [flags]:
    group: true
    summary: Cryptographic hash functions (md5, sha1, sha224, sha256, sha384, sha512, sha3-256, sha3-512)

  ubertool hash md5 [input] [flags]:
    summary: Compute MD5 hash (legacy / not collision-resistant)
    arguments:
      - name: input
        summary: Literal input to hash (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hash sha1 [input] [flags]:
    summary: Compute SHA-1 hash (legacy / not collision-resistant)
    arguments:
      - name: input
        summary: Literal input to hash (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
