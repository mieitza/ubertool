        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool jwt verify [input] [flags]:
    summary: Verify a JWT signature (HS256/384/512 or RS256/384/512 or ES256/384)
    arguments:
      - name: input
        summary: JWT to verify (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: secret
        summary: Shared HMAC secret (for HS* algorithms)
        type: string
      - name: key-file
        summary: Path to a PEM public key (for RS*/ES* algorithms)
        type: string
      - name: algo
        summary: Signing algorithm
        type: string
        default: hs256
        choices:
          - value: hs256
          - value: hs384
          - value: hs512
          - value: rs256
          - value: rs384
          - value: rs512
          - value: es256
          - value: es384
      - name: validate-exp
        summary: Validate exp claim against the current time
        type: boolean
        default: false
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
