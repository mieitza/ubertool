  ubertool uuid {command} [flags]:
    group: true
    summary: UUID generation (v4, v7)

  ubertool uuid new [flags]:
    summary: Generate a new UUID (default version 4)
    flags:
      - name: version
        summary: UUID version (4 = random, 7 = time-ordered)
        type: string
        default: "4"
        choices:
          - value: "4"
          - value: "7"
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool yaml {command} [flags]:
    group: true
    summary: "YAML conversion: to-json / to-toml"

  ubertool yaml to-json [input] [flags]:
    summary: Convert YAML to JSON
    arguments:
      - name: input
        summary: Literal YAML to convert (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
