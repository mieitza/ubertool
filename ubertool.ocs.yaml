      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hash sha512 [input] [flags]:
    summary: Compute SHA-512 hash
    arguments:
      - name: input
        summary: Literal input to hash (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hash sha3-256 [input] [flags]:
    summary: Compute SHA3-256 hash (Keccak)
    arguments:
      - name: input
        summary: Literal input to hash (omit to read from --in or stdin)
        required: false
