        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hash sha224 [input] [flags]:
    summary: Compute SHA-224 hash
    arguments:
      - name: input
        summary: Literal input to hash (omit to read from --in or stdin)
        required: false
        type: string
    flags:
      - name: in
        summary: Read input from file
        type: string
      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool hash sha256 [input] [flags]:
    summary: Compute SHA-256 hash
    arguments:
      - name: input
        summary: Literal input to hash (omit to read from --in or stdin)
