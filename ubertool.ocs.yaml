  ubertool html {command} [flags]:
    group: true
    summary: HTML entity encoding and decoding

  ubertool html encode [input] [flags]:
    summary: Encode HTML-special characters into entities
    arguments:
      - name: input
        summary: Literal input to encode (omit to read from --in or stdin)
        required: false
        type: string
    flags:
