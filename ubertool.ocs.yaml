      - name: json
        summary: Output result as JSON on stdout
        type: boolean
        default: false
      - name: quiet
        aliases: [q]
        summary: Output bare value only (pipe-friendly)
        type: boolean
        default: false

  ubertool jwt {command} [flags]:
